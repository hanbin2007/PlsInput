# PlsInput 持续集成
#
# 四个任务：
#   core-tests   SwiftPM 库与测试（不碰模拟器）
#   app-build    XcodeGen 生成工程 + 编译 iOS 模拟器版 App，产物给 sim-smoke 用
#   config-check 校验 remote/config.json，并用 plsbot 跑一遍平衡回归门禁
#   sim-smoke    把 App 装进模拟器跑一小段脚本，确认没有当场崩溃（容许失败）
#
# 所有 actions/* 都钉在完整 commit SHA 上（后面的 # vX.Y.Z 只是给人看的），
# tag 可以被重新指向，SHA 不会。升级交给 Dependabot（.github/dependabot.yml）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 工具链版本集中在这里，换 Xcode 只改这一行（runs-on 的镜像标签不能用 env，需要另外改）。
  XCODE_VERSION: "26.6"
  BUNDLE_ID: cn.origenclub.plsinput
  SCHEME: PlsInput

jobs:
  core-tests:
    name: Core tests (SwiftPM)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          install-xcodegen: "false"

      - name: Swift build
        run: swift build --build-tests

      - name: Swift test
        run: swift test

  app-build:
    name: App build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build app
        run: |
          set -euo pipefail
          mkdir -p .build
          build() {
            xcodebuild \
              -project App/PlsInput.xcodeproj \
              -scheme "${SCHEME}" \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              -derivedDataPath .build/DerivedData \
              build
          }
          if command -v xcbeautify >/dev/null 2>&1; then
            build | tee .build/xcodebuild.log | xcbeautify
          else
            build | tee .build/xcodebuild.log
          fi

      - name: Package app
        run: |
          set -euo pipefail
          products=.build/DerivedData/Build/Products/Debug-iphonesimulator
          test -d "${products}/${SCHEME}.app"
          tar -czf "${SCHEME}-sim.tar.gz" -C "${products}" "${SCHEME}.app"
          ls -lh "${SCHEME}-sim.tar.gz"

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plsinput-sim-app
          path: PlsInput-sim.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-log
          path: .build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

  config-check:
    name: Remote config check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          install-xcodegen: "false"

      # 门禁逻辑全在脚本里，本地可以原样跑：bash scripts/ci/config-gate.sh remote/config.json
      - name: Balance regression gate
        run: bash scripts/ci/config-gate.sh remote/config.json

      - name: Upload bot report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plsbot-report
          path: .build/config-gate/**
          retention-days: 7
          if-no-files-found: ignore

  sim-smoke:
    name: Simulator smoke
    needs: app-build
    runs-on: macos-26
    timeout-minutes: 25
    # 模拟器启动本身偶发失败，这一关只作参考，不卡 PR。
    # 正因为不卡 PR，最后一步一定要往 job summary 里写一行结论，否则没人会注意到它红了。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # simctl 必须来自和编译 App 时同一个 Xcode，否则模拟器运行时对不上。
      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          install-xcodegen: "false"

      - name: Download app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plsinput-sim-app
          path: sim-app

      - name: Unpack app
        id: unpack
        run: |
          set -euo pipefail
          tar -xzf "sim-app/${SCHEME}-sim.tar.gz" -C sim-app
          ls -d "sim-app/${SCHEME}.app"

      - name: Boot simulator
        id: sim
        run: |
          set -euo pipefail
          # 运行时按数字版本排序（字符串排序会把 iOS-9-0 排在 iOS-26-0 后面），
          # 并且只考虑真的有 iPhone 设备的那些运行时，取版本最高的一个。
          runtimes="$(xcrun simctl list runtimes available -j)"
          devices="$(xcrun simctl list devices available -j)"
          picked="$(jq -n -r \
            --argjson runtimes "${runtimes}" \
            --argjson devices "${devices}" '
            [ $runtimes.runtimes[]
              | select((.identifier // "") | test("SimRuntime\\.iOS-"))
              | . as $rt
              | (($devices.devices[$rt.identifier] // [])
                 | map(select((.name // "") | startswith("iPhone")))) as $phones
              | select(($phones | length) > 0)
              | { version: (.version // "0"), udid: $phones[0].udid, device: $phones[0].name, runtime: (.name // .identifier) }
            ]
            | sort_by(.version | split(".") | map(tonumber))
            | last
            | if . == null then "" else "\(.udid)\t\(.device)\t\(.runtime)" end')"
          if [ -z "${picked}" ]; then
            echo "::error title=No simulator::this image has no available iPhone simulator on any iOS runtime"
            xcrun simctl list runtimes available
            xcrun simctl list devices available
            exit 1
          fi
          udid="$(printf '%s' "${picked}" | cut -f1)"
          device="$(printf '%s' "${picked}" | cut -f2)"
          runtime="$(printf '%s' "${picked}" | cut -f3)"
          echo "booting ${device} on ${runtime} (${udid})"
          xcrun simctl boot "${udid}" || true
          xcrun simctl bootstatus "${udid}" -b
          {
            echo "udid=${udid}"
            echo "device=${device}"
            echo "runtime=${runtime}"
          } >> "$GITHUB_OUTPUT"

      - name: Install and launch
        id: launch
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl install "${UDID}" "sim-app/${SCHEME}.app"
          # 脚本语法见 App/Sources/PlsInputApp.swift 的 LaunchArguments：
          # w<秒> 等待，k<键序号> 按键，s<格序号> 选格。这里只填两格，不结束对局。
          output="$(xcrun simctl launch "${UDID}" "${BUNDLE_ID}" \
            --skip-tutorial --autostart-practice --seed 1 --script "w1,k0,s0,k1,s1,w2")"
          echo "${output}"
          pid="$(echo "${output}" | awk -F': ' '{print $2}')"
          echo "PLSINPUT_PID=${pid}" >> "$GITHUB_ENV"

      - name: Assert still running
        id: assert
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          # 脚本本身要跑掉 3 秒（w1 + 两组按键 + w2），再留出余量看它有没有在收尾时崩。
          sleep 15
          mkdir -p artifacts
          xcrun simctl io "${UDID}" screenshot artifacts/smoke.png || true
          xcrun simctl spawn "${UDID}" launchctl list | grep -i plsinput || true
          if ps -p "${PLSINPUT_PID}" > /dev/null 2>&1; then
            echo "app (pid ${PLSINPUT_PID}) is still alive after 15s"
          else
            echo "::error title=Smoke failed::app exited within 15s, see the crash log below"
            find ~/Library/Logs/DiagnosticReports -name '*PlsInput*' -maxdepth 1 -print -exec cat {} \; 2>/dev/null || true
            exit 1
          fi

      - name: Report smoke result
        if: always()
        env:
          UNPACK: ${{ steps.unpack.outcome }}
          BOOT: ${{ steps.sim.outcome }}
          LAUNCH: ${{ steps.launch.outcome }}
          ASSERT: ${{ steps.assert.outcome }}
          DEVICE: ${{ steps.sim.outputs.device }}
          RUNTIME: ${{ steps.sim.outputs.runtime }}
        run: |
          set -euo pipefail
          if [ "${ASSERT:-}" = "success" ]; then
            line="sim-smoke: PASS app stayed alive for 15s on ${DEVICE:-?} / ${RUNTIME:-?}"
          elif [ "${UNPACK:-}" != "success" ]; then
            line="sim-smoke: FAIL could not unpack the app artifact (unpack=${UNPACK:-not-run})"
          elif [ "${BOOT:-}" != "success" ]; then
            line="sim-smoke: FAIL could not boot an iPhone simulator (boot=${BOOT:-not-run})"
          elif [ "${LAUNCH:-}" != "success" ]; then
            line="sim-smoke: FAIL install or launch failed (launch=${LAUNCH:-not-run})"
          else
            line="sim-smoke: FAIL app did not survive 15s on ${DEVICE:-?} / ${RUNTIME:-?} (assert=${ASSERT:-not-run})"
          fi
          echo "${line}"
          echo "${line}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-smoke-screenshot
          path: artifacts/smoke.png
          retention-days: 7
          if-no-files-found: warn
